name: Convert PWA to APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Bundle Web Files
        run: |
          mkdir www
          # Copies your PWA files into the directory Capacitor expects
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ www/

      - name: Initialize Android Project
        run: |
          npx cap init "beka tips" com.bekatips.app --web-dir www
          npx cap add android

      - name: Replace App Icon with b.png
        run: |
          if [ -f b.png ]; then
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f b.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f b.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: |
          cd android 
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK file
        run: mv android/app/build/outputs/apk/debug/app-debug.apk beka-tips.apk

      - name: Upload Beka Tips APK
        uses: actions/upload-artifact@v4
        with:
          name: beka-tips-apk
          path: beka-tips.apk
