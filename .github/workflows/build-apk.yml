name: Convert PWA to APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Splash Screen Plugin
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: Bundle Web Files
        run: |
          mkdir www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ www/

      - name: Create Capacitor Config with Splash Screen Settings
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.bekatips.app",
            "appName": "beka tips",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup App Icon (s.png) & Loading Splash Screen (bo.png)
        run: |
          # 1. Set up App Icon
          if [ -f s.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            find android/app/src/main/res -name "ic_launcher*.xml" -type f -delete
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi
          
          # 2. Set up Splash Screen
          if [ -f bo.png ]; then
            # Delete Capacitor's default XML splash files to prevent black screen conflicts
            find android/app/src/main/res -name "splash.xml" -type f -delete
            find android/app/src/main/res -name "splash.png" -type f -delete
            
            # Copy bo.png to all primary drawable directories
            for dir in drawable drawable-port drawable-port-hdpi drawable-port-xhdpi drawable-port-xxhdpi drawable-port-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp -f bo.png "android/app/src/main/res/$dir/splash.png"
            done
          fi

      - name: Reduce APK Size & Fix Kotlin Duplicate Classes
        run: |
          sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "arm64-v8a", "armeabi-v7a"\n        }' android/app/build.gradle
          
          cat <<EOF >> android/app/build.gradle
          
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Signed Debug APK (Installable)
        run: |
          cd android 
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK file
        run: mv android/app/build/outputs/apk/debug/app-debug.apk beka-tips.apk

      - name: Upload Beka Tips APK
        uses: actions/upload-artifact@v4
        with:
          name: beka-tips-apk
          path: beka-tips.apk
